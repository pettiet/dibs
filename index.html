<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dibs</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dibs">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1F4D3A">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  --bg: #F7F3EC; --surface: #FFFFFF; --surface-2: #F1ECE3;
  --ink: #1E2421; --muted: #6B746F; --line: #ECE5D9;
  --green: #1F4D3A; --green-soft: #E4EEE8;
  --red: #B3263E; --red-soft: #F9E5E8;
  --gold: #A87A1F; --gold-soft: #F7EDD6;
  --header: #1F4D3A;
  --radius: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111814; --surface: #1A231E; --surface-2: #243029;
    --ink: #EEF2EF; --muted: #9DA9A2; --line: #2B362F;
    --green: #7FC4A0; --green-soft: #1F3329;
    --red: #F07A8C; --red-soft: #3A1E24;
    --gold: #E2B65A; --gold-soft: #3A3020;
    --header: #18392B;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  padding-bottom: calc(84px + env(safe-area-inset-bottom));
}
button, input, textarea, select { font: inherit; color: inherit; }
.wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; }

/* ---------- header & tabs ---------- */
header.top { background: var(--header); color: #fff; padding: calc(12px + env(safe-area-inset-top)) 0 12px; }
header.top .wrap { display: flex; align-items: center; gap: 12px; }
.brand { font-family: "Fraunces", Georgia, serif; font-weight: 800; font-size: 26px; line-height: 1; }
.brand small { display: block; font: 600 13px/1.3 -apple-system, system-ui, sans-serif; opacity: .75; margin-top: 3px; }
.me-chip { margin-left: auto; background: rgba(255,255,255,.14); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 15px; white-space: nowrap; }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  display: flex; padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
}
nav.tabs button {
  flex: 1; border: 0; background: none; padding: 6px 4px; border-radius: 14px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  font-size: 13px; font-weight: 700; color: var(--muted); position: relative;
}
nav.tabs .ico { font-size: 24px; line-height: 1.15; }
nav.tabs button.on { color: var(--green); background: var(--green-soft); }
.badge { position: absolute; top: 1px; left: 56%; background: var(--red); color: #fff; border-radius: 999px; font-size: 11px; min-width: 18px; height: 18px; line-height: 18px; padding: 0 5px; }
@media (min-width: 820px) {
  body { padding-bottom: 40px; }
  nav.tabs { position: sticky; top: 0; bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); justify-content: center; gap: 8px; padding: 8px; }
  nav.tabs button { flex: 0 0 auto; flex-direction: row; gap: 8px; font-size: 16px; padding: 8px 18px; }
  nav.tabs .ico { font-size: 20px; }
  .badge { position: static; }
}

main { padding-top: 16px; }
h2 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 26px; margin: 2px 0 2px; }
.sub { color: var(--muted); margin: 0 0 14px; font-size: 16px; }
.section-label { font-size: 14px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 22px 4px 8px; display: flex; align-items: center; gap: 8px; }
.section-label .sum { margin-left: auto; text-transform: none; letter-spacing: 0; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 10px 18px; border-radius: 14px; border: 0;
  font-weight: 700; font-size: 17px; cursor: pointer; text-decoration: none;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--green); color: #fff; }
.btn.claim { background: var(--red); color: #fff; }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.outline { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; pointer-events: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary, :root:not([data-theme="light"]) .btn.claim { color: #111814; } }
.textbtn { background: none; border: 0; color: var(--green); font-weight: 700; padding: 10px 4px; cursor: pointer; font-size: 16px; }

.seg { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 14px; margin: 0 0 14px; overflow-x: auto; }
.seg button { flex: 1; border: 0; background: none; padding: 10px 12px; border-radius: 11px; font-weight: 700; white-space: nowrap; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

/* ---------- list rows ---------- */
.list { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer;
  border-top: 1px solid var(--line); min-height: 72px;
}
.row:first-child { border-top: 0; }
.row:active { background: var(--surface-2); }
.thumb { flex: 0 0 52px; height: 52px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; font-size: 24px; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb img.fav { width: 26px; height: 26px; object-fit: contain; }
.rt { flex: 1; min-width: 0; }
.r1 { font-weight: 700; font-size: 17px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.r1 .star { color: var(--gold); }
.r2 { color: var(--muted); font-size: 15px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chev { color: var(--muted); font-size: 22px; flex: 0 0 auto; }
.pill { flex: 0 0 auto; font-size: 14px; font-weight: 700; padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
.pill.taken { background: var(--surface-2); color: var(--muted); }
.pill.mine { background: var(--red-soft); color: var(--red); }
.pill.bought { background: var(--green-soft); color: var(--green); }
.pill.warn { background: var(--gold-soft); color: var(--gold); }
.getbtn { flex: 0 0 auto; background: var(--red); color: #fff; border: 0; border-radius: 12px; font-weight: 800; font-size: 15px; padding: 10px 14px; cursor: pointer; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .getbtn { color: #111814; } }
.check {
  flex: 0 0 34px; height: 34px; border-radius: 50%; border: 2.5px solid var(--line); background: var(--surface);
  display: grid; place-items: center; font-size: 18px; font-weight: 900; color: transparent; cursor: pointer;
}
.check.on { background: var(--green); border-color: var(--green); color: #fff; }
.row.done .r1 { text-decoration: line-through; color: var(--muted); }
.row.dim { opacity: .6; }

.addrow { display: flex; align-items: center; gap: 12px; padding: 14px; width: 100%; border: 2px dashed var(--line); border-radius: var(--radius); background: transparent; color: var(--green); font-weight: 800; font-size: 17px; cursor: pointer; margin-bottom: 12px; }
.addrow .plus { width: 52px; height: 52px; border-radius: 12px; background: var(--green-soft); display: grid; place-items: center; font-size: 26px; }
.inforow { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; margin-bottom: 12px; width: 100%; text-align: left; }
.inforow .rt .r2 { white-space: nowrap; }
.morebtn { display: block; width: 100%; margin-top: 12px; padding: 14px; border: 0; border-radius: var(--radius); background: var(--surface-2); color: var(--ink); font-weight: 700; cursor: pointer; text-align: center; }

/* people */
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.person { padding: 16px 14px; text-align: left; cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); }
.person .em { font-size: 32px; line-height: 1; }
.person .nm { font-weight: 800; font-size: 19px; margin-top: 8px; }
.person .ct { color: var(--muted); font-size: 14px; margin-top: 2px; }
.person.self { opacity: .5; }

.summary { display: flex; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px; font-weight: 700; margin-bottom: 4px; }
.summary span { color: var(--muted); font-weight: 600; }
.empty { text-align: center; color: var(--muted); padding: 30px 16px; }
.empty .big { font-size: 44px; }
.back { margin: -6px 0 2px -4px; }
.spinner { width: 32px; height: 32px; border: 4px solid var(--line); border-top-color: var(--green); border-radius: 50%; animation: spin .8s linear infinite; margin: 30px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.center { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: 30px 20px; }

/* ---------- sheets: header, scrolling body, pinned footer ---------- */
.scrim { position: fixed; left: 0; right: 0; top: 0; height: 100%; background: rgba(10,15,12,.45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--surface); width: 100%; max-width: 560px; max-height: calc(100% - 10px);
  border-radius: 22px 22px 0 0; display: flex; flex-direction: column; animation: up .2s ease-out; margin: 0;
}
@media (min-width: 620px) { .scrim { align-items: center; } .sheet { border-radius: 22px; max-height: 88%; } }
@keyframes up { from { transform: translateY(30px); opacity: .5; } }
.sh-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 10px; }
.sh-head h2 { flex: 1; margin: 0; font-size: 22px; }
.xbtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface-2); font-size: 18px; cursor: pointer; flex: 0 0 auto; }
.sh-body { overflow-y: auto; padding: 4px 18px 16px; -webkit-overflow-scrolling: touch; }
.sh-foot { display: flex; gap: 10px; padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--surface); }
@media (min-width: 620px) { .sh-foot { border-radius: 0 0 22px 22px; } }
.sh-foot .btn { flex: 1; }
.sh-foot .btn.wide { flex: 2; }

label.f { display: block; font-weight: 700; font-size: 15px; margin: 12px 0 5px; }
label.f .opt { color: var(--muted); font-weight: 500; }
.in { width: 100%; border: 1.5px solid var(--line); background: var(--bg); border-radius: 12px; padding: 11px 13px; font-size: 17px; min-height: 50px; }
.in:focus { outline: none; border-color: var(--green); }
textarea.in { min-height: 70px; resize: vertical; }
select.in { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 22px, calc(100% - 14px) 22px; background-size: 6px 6px; background-repeat: no-repeat; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.togs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.tog { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 14px; font-weight: 700; font-size: 15px; cursor: pointer; }
.tog.on { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }
.lookup { font-size: 14px; color: var(--green); margin-top: 5px; min-height: 0; }
.lookup:empty { display: none; }
.remove { display: block; margin: 18px auto 0; color: var(--red); }

/* detail view */
.hero { width: 100%; max-height: 220px; object-fit: contain; border-radius: 14px; background: var(--surface-2); margin-bottom: 12px; }
.d-title { font-size: 21px; font-weight: 800; line-height: 1.25; margin: 0 0 8px; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 10px 0; font-size: 16px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-weight: 600; word-break: break-word; }
.notes { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; margin: 10px 0; white-space: pre-wrap; word-break: break-word; }
.banner { border-radius: 12px; padding: 10px 12px; font-size: 15px; font-weight: 600; margin: 10px 0; }
.banner.warn { background: var(--gold-soft); color: var(--gold); }
.banner.secret { background: var(--green-soft); color: var(--green); }
.banner.gone { background: var(--red-soft); color: var(--red); }
.who { font-weight: 700; margin: 10px 0; }
.who.mine { color: var(--red); }
.who.bought { color: var(--green); }
.who.taken { color: var(--muted); }
.linkout { margin: 8px 0 4px; }
.stepper { display: flex; align-items: center; justify-content: center; gap: 22px; margin: 18px 0; }
.stepper .num { font-size: 34px; font-weight: 800; min-width: 44px; text-align: center; }
.stepper button { width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--surface-2); font-size: 26px; font-weight: 700; cursor: pointer; }
.emojis { display: flex; flex-wrap: wrap; gap: 6px; }
.emojis button { font-size: 24px; width: 46px; height: 46px; border-radius: 12px; border: 2px solid transparent; background: var(--surface-2); cursor: pointer; }
.emojis button.on { border-color: var(--green); }
ol.how { padding-left: 22px; margin: 6px 0 12px; }
ol.how li { margin-bottom: 10px; }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 700; z-index: 60; max-width: 90vw; text-align: center; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.toast.err { background: var(--red); color: #fff; }
@media (min-width: 820px) { .toast { bottom: 30px; } }
</style>
</head>
<body>
<div id="app"><div class="center"><div class="spinner"></div></div></div>

<script>
/* ================================================================
   SETTINGS: your Supabase project
   ================================================================ */
const SUPABASE_URL = 'https://kdagizmxwgzalkbykuus.supabase.co';
const SUPABASE_KEY = 'sb_publishable_YOUR_KEY_HERE';   // <- paste your publishable key
const PREVIEW_FUNCTION = 'preview';                     // link look-up function; '' turns it off
/* ================================================================ */

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });
const $app = document.getElementById('app');

const S = {
  key: null, me: null, event: null, people: [], households: [],
  tab: 'mine', listFor: null, list: null,
  shopPerson: null, shopList: null, showTaken: false,
  shopScope: 'me', shopping: null, flags: 0,
};

/* ---------------- helpers ---------------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => (typeof u === 'string' && /^https?:\/\//i.test(u)) ? u : null;
const money = n => (n === null || n === undefined || n === '') ? '' :
  Number(n).toLocaleString('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: Number(n) % 1 ? 2 : 0 });
const person = id => S.people.find(p => p.id === id);
const first = s => esc(String(s || '').split(' ')[0]);
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };
const byStar = (a, b) => (b.starred === true) - (a.starred === true);

async function rpc(fn, args) {
  const { data, error } = await db.rpc(fn, { p_key: S.key, ...args });
  if (error) throw new Error(error.message || 'Something went wrong.');
  return data;
}
let toastTimer;
function toast(msg, err) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), err ? 4200 : 2200);
}
async function attempt(fn, okMsg) {
  try { const r = await fn(); if (okMsg) toast(okMsg); return r; }
  catch (e) { toast(e.message, true); throw e; }
}
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

/* ---------------- boot & data ---------------- */
async function boot() {
  const params = new URLSearchParams(location.search);
  S.key = params.get('key') || lsGet('dibs.key');
  if (!S.key) return renderNoKey();
  if (params.get('key')) lsSet('dibs.key', S.key);
  try { await loadMe(); } catch (e) { return renderNoKey(e.message); }
  S.listFor = S.me.id;
  const saved = lsGet('dibs.tab');
  if (['mine', 'shop', 'shopping'].includes(saved)) S.tab = saved;
  await refresh();
  if (!lsGet('dibs.intro.' + S.me.id)) showIntro();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !document.querySelector('.scrim')) refresh(true); });
  setInterval(() => { if (!document.hidden && !document.querySelector('.scrim')) refresh(true); }, 60000);
}
async function loadMe() {
  const d = await rpc('wl_me');
  S.me = d.me; S.event = d.event; S.people = d.people; S.households = d.households;
}
async function refresh(quiet) {
  try {
    await loadMe();
    const jobs = [rpc('wl_shopping', { p_scope: S.shopScope }).then(d => S.shopping = d)];
    if (S.tab === 'mine') jobs.push(rpc('wl_list', { p_owner: S.listFor }).then(d => S.list = d));
    if (S.tab === 'shop' && S.shopPerson) jobs.push(rpc('wl_list', { p_owner: S.shopPerson }).then(d => S.shopList = d));
    await Promise.all(jobs);
  } catch (e) { if (!quiet) toast(e.message, true); }
  render();
}

/* ---------------- shell ---------------- */
function render() {
  if (!S.me) return;
  const y = window.scrollY;
  S.flags = (S.shopping?.rows || []).filter(r => r.mine && (r.changed || (r.removed && r.status !== 'bought'))).length;
  const tab = (id, ico, label, badge) =>
    `<button class="${S.tab === id ? 'on' : ''}" data-act="tab" data-tab="${id}"><span class="ico">${ico}</span><span>${label}</span>${badge ? `<span class="badge">${badge}</span>` : ''}</button>`;
  $app.innerHTML = `
    <header class="top"><div class="wrap">
      <div class="brand">Dibs<small>${esc(S.event?.name || 'Family wish list')}</small></div>
      <div class="me-chip">${esc(S.me.emoji)} ${esc(S.me.name)}</div>
    </div></header>
    <nav class="tabs">
      ${tab('mine', '📝', 'My List')}
      ${tab('shop', '🎁', 'Shop')}
      ${tab('shopping', '🛍️', 'My Shopping', S.flags)}
    </nav>
    <main class="wrap">${!S.event ? empty('🎄', 'No wish list is open right now', 'Check back soon.')
      : S.tab === 'mine' ? viewMine() : S.tab === 'shop' ? viewShop() : viewShopping()}</main>`;
  window.scrollTo(0, y);
}
const empty = (big, title, sub) => `<div class="empty"><div class="big">${big}</div><p><strong>${esc(title)}</strong></p><p>${esc(sub || '')}</p></div>`;
function renderNoKey(msg) {
  $app.innerHTML = `<div class="center"><div>
    <img src="icon.png" alt="" width="84" height="84" style="border-radius:20px">
    <h2 style="margin-top:14px">Dibs</h2>
    <p class="sub">${esc(msg || 'This is a private family wish list.')}</p>
    <p>Open the personal link you were sent.</p></div></div>`;
}

/* ---------------- row pieces ---------------- */
function thumb(it) {
  const img = safeUrl(it.image_url), url = safeUrl(it.url);
  if (img) return `<div class="thumb"><img src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.textContent='🎁'"></div>`;
  if (url && host(url)) return `<div class="thumb"><img class="fav" src="https://www.google.com/s2/favicons?domain=${esc(host(url))}&sz=64" alt="" loading="lazy" onerror="this.parentNode.textContent='🎁'"></div>`;
  return `<div class="thumb">🎁</div>`;
}
function metaLine(it, opts = {}) {
  const bits = [];
  if (it.price !== null && it.price !== undefined) bits.push(money(it.price));
  if (it.size) bits.push('Size ' + esc(it.size));
  if (it.color) bits.push(esc(it.color));
  if (!opts.noQty) { if (it.qty === null) bits.push('Any number'); else if (it.qty > 1) bits.push('Wants ' + it.qty); }
  return bits.join(' · ');
}
function titleLine(it) {
  return `${it.secret ? '🤫 ' : ''}${it.starred ? '<span class="star">★</span> ' : ''}${esc(it.title)}`;
}
function rowShell(it, act, right, extraClass = '') {
  const m = metaLine(it);
  return `<div class="row ${extraClass}" data-act="${act}" data-id="${it.id}" role="button" tabindex="0">
    ${thumb(it)}
    <div class="rt"><div class="r1">${titleLine(it)}</div>${m ? `<div class="r2">${m}</div>` : ''}</div>
    ${right}
  </div>`;
}

/* ---------------- My List ---------------- */
function viewMine() {
  const managed = S.people.filter(p => p.i_manage);
  const isMe = S.listFor === S.me.id;
  const owner = person(S.listFor) || S.me;
  let html = '';
  if (managed.length) {
    html += `<div class="seg">
      <button class="${isMe ? 'on' : ''}" data-act="listfor" data-id="${S.me.id}">${esc(S.me.emoji)} Mine</button>
      ${managed.map(p => `<button class="${S.listFor === p.id ? 'on' : ''}" data-act="listfor" data-id="${p.id}">${esc(p.emoji)} ${esc(p.name)}'s</button>`).join('')}
    </div>`;
  }
  html += `<h2>${isMe ? 'My wish list' : esc(owner.name) + "'s wish list"}</h2>
    <p class="sub">${isMe ? 'Your list stays a surprise. You won\'t see who\'s buying what.' : `You manage this list for ${esc(owner.name)}.`}</p>`;
  const L = S.list;
  if (!L || L.person.id !== S.listFor) return html + `<div class="spinner"></div>`;

  html += `<button class="addrow" data-act="add"><span class="plus">＋</span> Add a wish</button>`;
  const items = L.items.slice().sort(byStar);
  if (items.length) {
    html += `<div class="list">${items.map(it => {
      let right = '<span class="chev">›</span>';
      if (!isMe && it.claims?.length) right = `<span class="pill taken">Taken</span>`;
      return rowShell(it, 'edit', right);
    }).join('')}</div>`;
  } else {
    html += empty('✨', 'Nothing here yet', 'Tap "Add a wish" to start.');
  }
  html += `<div class="section-label">${isMe ? 'About me' : 'About ' + esc(owner.name)}</div>`;
  html += sizesRow(L.person, true);
  return html;
}

const CARD_FIELDS = [
  ['shirt', 'Shirt'], ['pants', 'Pants'], ['shoes', 'Shoes'], ['dress', 'Dress'], ['hat', 'Hat'], ['ring', 'Ring'],
  ['colors', 'Favorite colors'], ['stores', 'Favorite stores'], ['likes', 'Likes & hobbies'], ['no', 'Please no'], ['other', 'Anything else'],
];
function sizesRow(p, editable) {
  const card = p.card || {};
  const filled = CARD_FIELDS.filter(([k]) => card[k]);
  const summary = filled.length ? filled.slice(0, 3).map(([k, l]) => `${l.replace('Favorite ', '')} ${esc(card[k])}`).join(' · ')
    : (editable ? 'Add your sizes so shopping is easy' : 'Not filled in yet');
  return `<button class="inforow" data-act="${editable ? 'editcard' : 'viewcard'}">
    <div class="thumb">📏</div>
    <div class="rt"><div class="r1">Sizes &amp; favorites</div><div class="r2">${summary}</div></div>
    <span class="chev">›</span>
  </button>`;
}

/* ---------------- Shop ---------------- */
function viewShop() {
  if (S.shopPerson) return viewShopPerson();
  let html = `<h2>Shop</h2><p class="sub">Tap a name to see their list.</p>`;
  const groups = S.households.map(h => ({ name: h.name, people: S.people.filter(p => p.household_id === h.id) }));
  const loose = S.people.filter(p => !p.household_id);
  if (loose.length) groups.push({ name: 'Everyone else', people: loose });
  for (const g of groups) {
    if (!g.people.length) continue;
    html += `<div class="section-label">${esc(g.name)}</div><div class="people">`;
    for (const p of g.people) {
      const self = p.id === S.me.id;
      html += `<button class="person ${self ? 'self' : ''}" data-act="${self ? 'tab' : 'shopperson'}" data-tab="mine" data-id="${p.id}">
        <div class="em">${esc(p.emoji)}</div><div class="nm">${esc(p.name)}</div>
        <div class="ct">${self ? "That's you" : !p.count ? 'No wishes yet' : p.open ? `${p.open} still open` : 'All taken'}</div>
      </button>`;
    }
    html += `</div>`;
  }
  return html;
}

function shopState(it) {
  const mine = it.claims.find(c => c.mine);
  const others = it.claims.filter(c => !c.mine);
  const open = !it.removed && (it.remaining === null || it.remaining > 0);
  return { mine, others, open };
}

function viewShopPerson() {
  const p = person(S.shopPerson);
  let html = `<button class="textbtn back" data-act="shopback">‹ Everyone</button>
    <h2>${esc(p?.emoji || '')} ${esc(p?.name || '')}</h2>`;
  const L = S.shopList;
  if (!L || L.person.id !== S.shopPerson) return html + `<div class="spinner"></div>`;
  if (p.managers?.length && !p.has_link) html += `<p class="sub">${esc(p.managers.join(' & '))} manage this list.</p>`;
  else html += `<p class="sub">Tap anything to see details.</p>`;

  const items = L.items.slice().sort(byStar);
  const yours = items.filter(it => shopState(it).mine);
  const open = items.filter(it => !shopState(it).mine && shopState(it).open);
  const taken = items.filter(it => !shopState(it).mine && !shopState(it).open);

  const rowFor = it => {
    const { mine, open } = shopState(it);
    let right;
    if (it.removed) right = `<span class="pill warn">Removed</span>`;
    else if (mine && mine.changed) right = `<span class="pill warn">⚠️ Changed</span>`;
    else if (mine) right = mine.status === 'bought' ? `<span class="pill bought">Bought ✓</span>` : `<span class="pill mine">Yours</span>`;
    else if (open) right = `<button class="getbtn" data-act="claim" data-id="${it.id}">I'll get it</button>`;
    else right = `<span class="pill taken">Taken</span>`;
    return rowShell(it, 'detail', right, !open && !mine ? 'dim' : '');
  };

  if (!items.length) html += empty('🕯️', `${p.name} hasn't added anything yet`, '');
  if (yours.length) html += `<div class="section-label">You're getting</div><div class="list">${yours.map(rowFor).join('')}</div>`;
  if (open.length) html += `<div class="section-label">Still open</div><div class="list">${open.map(rowFor).join('')}</div>`;
  else if (items.length && !yours.length) html += `<p class="sub" style="margin-top:16px">Everything on ${esc(p.name)}'s list is taken.</p>`;
  if (taken.length) {
    html += S.showTaken
      ? `<div class="section-label">Already taken</div><div class="list">${taken.map(rowFor).join('')}</div>
         <button class="morebtn" data-act="toggletaken">Hide taken items</button>`
      : `<button class="morebtn" data-act="toggletaken">Show ${taken.length} already taken ›</button>`;
  }

  html += `<div class="section-label">More</div>`;
  html += sizesRow(L.person, false);
  html += `<button class="inforow" data-act="addsecret">
    <div class="thumb">🤫</div>
    <div class="rt"><div class="r1">Add a surprise gift</div><div class="r2">Not on their list? Add it so nobody doubles up.</div></div>
    <span class="chev">›</span></button>`;
  return html;
}

/* ---------------- My Shopping ---------------- */
function viewShopping() {
  const D = S.shopping;
  const hh = S.households.find(h => h.id === S.me.household_id);
  const hhCount = S.people.filter(p => p.household_id && p.household_id === S.me.household_id).length;
  let html = `<h2>My shopping</h2>`;
  if (hh && hhCount > 1) {
    html += `<div class="seg">
      <button class="${S.shopScope === 'me' ? 'on' : ''}" data-act="scope" data-scope="me">Just me</button>
      <button class="${S.shopScope === 'household' ? 'on' : ''}" data-act="scope" data-scope="household">Our house</button>
    </div>`;
  }
  if (!D) return html + `<div class="spinner"></div>`;
  const rows = D.rows;
  if (!rows.length) return html + empty('🛍️', 'Nothing yet', 'In Shop, tap "I\'ll get it" on something.');
  const live = rows.filter(r => !(r.removed && r.status !== 'bought'));
  const toBuy = rows.filter(r => r.status === 'claimed').length;
  const total = live.reduce((a, r) => a + (r.item.price ? Number(r.item.price) * r.qty : 0), 0);
  html += `<div class="summary"><div>${toBuy} to buy <span>· ${rows.length - toBuy} bought</span></div><div>${total ? '~' + money(total) : ''}</div></div>
    <p class="sub" style="margin:8px 4px 0;font-size:15px">Tap the circle when you've bought it.</p>`;

  const groups = new Map();
  rows.forEach(r => { if (!groups.has(r.recipient.id)) groups.set(r.recipient.id, []); groups.get(r.recipient.id).push(r); });
  for (const [, list] of groups) {
    const rc = list[0].recipient;
    const sub = list.reduce((a, r) => a + (r.item.price && !(r.removed && r.status !== 'bought') ? Number(r.item.price) * r.qty : 0), 0);
    list.sort((a, b) => (a.status === 'bought') - (b.status === 'bought'));
    html += `<div class="section-label">${esc(rc.emoji)} For ${esc(rc.name)}<span class="sum">${sub ? money(sub) : ''}</span></div><div class="list">`;
    html += list.map(r => {
      const bought = r.status === 'bought';
      const flag = r.removed ? `<span class="pill warn">Removed</span>` : r.changed ? `<span class="pill warn">⚠️ Changed</span>` : '';
      const m = [metaLine(r.item, { noQty: true }), S.shopScope === 'household' && !r.mine ? esc(r.claimer) : ''].filter(Boolean).join(' · ');
      return `<div class="row ${bought ? 'done' : ''}" data-act="sdetail" data-claim="${r.claim_id}" role="button" tabindex="0">
        <button class="check ${bought ? 'on' : ''}" data-act="togglebought" data-claim="${r.claim_id}" data-do="${bought ? 'unbought' : 'bought'}" aria-label="${bought ? 'Mark not bought' : 'Mark bought'}">✓</button>
        <div class="rt"><div class="r1">${titleLine(r.item)}${r.qty > 1 ? ` ×${r.qty}` : ''}</div>${m ? `<div class="r2">${m}</div>` : ''}</div>
        ${flag}
      </div>`;
    }).join('');
    html += `</div>`;
  }
  return html;
}

/* ---------------- sheets ---------------- */
function openSheet({ title, body, foot, form }) {
  closeSheet();
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  const tag = form ? 'form' : 'div';
  scrim.innerHTML = `<${tag} class="sheet" ${form ? 'id="sheetform" autocomplete="off" novalidate' : ''} role="dialog" aria-modal="true">
    <div class="sh-head"><h2>${title}</h2><button type="button" class="xbtn" data-act="close" aria-label="Close">✕</button></div>
    <div class="sh-body">${body}</div>
    ${foot ? `<div class="sh-foot">${foot}</div>` : ''}
  </${tag}>`;
  scrim.addEventListener('click', e => { if (e.target === scrim) closeSheet(); });
  document.body.appendChild(scrim);
  document.body.style.overflow = 'hidden';
  fitScrim();
  return scrim;
}
function closeSheet() {
  document.querySelectorAll('.scrim').forEach(s => s.remove());
  document.body.style.overflow = '';
}
// Keep the sheet (and its Save button) above the phone keyboard
function fitScrim() {
  const s = document.querySelector('.scrim'), v = window.visualViewport;
  if (!s || !v) return;
  s.style.top = v.offsetTop + 'px';
  s.style.height = v.height + 'px';
}
if (window.visualViewport) {
  visualViewport.addEventListener('resize', fitScrim);
  visualViewport.addEventListener('scroll', fitScrim);
}

      <input class="in" name="url" type="text" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="Paste from any store" value="${esc(it.url || '')}">
      <div class="lookup" id="lookup"></div>
      <div class="row2">
        <div><label class="f">Price <span class="opt">(about)</span></label><input class="in" name="price" inputmode="decimal" placeholder="$" value="${it.price ?? ''}"></div>
        <div><label class="f">Size</label><input class="in" name="size" maxlength="80" value="${esc(it.size || '')}"></div>
      </div>
      <div class="row2">
        <div><label class="f">Color</label><input class="in" name="color" maxlength="80" value="${esc(it.color || '')}"></div>
        ${opts.secret ? '<div></div>' : `<div><label class="f">How many</label><select class="in" name="qty">${qtyOpts}</select></div>`}
      </div>
      <label class="f">Notes <span class="opt">(optional)</span></label>
      <textarea class="in" name="notes" maxlength="1000" rows="2" placeholder="e.g. The blue one, not navy">${esc(it.notes || '')}</textarea>
      ${opts.secret ? '' : `<div class="togs">
        <button type="button" class="tog ${it.starred ? 'on' : ''}" data-tog="starred">★ Really want it</button>
        <button type="button" class="tog ${it.flexible ? 'on' : ''}" data-tog="flexible">Similar is fine</button>
      </div>`}
      <input type="hidden" name="image_url" value="${esc(it.image_url || '')}">
      ${it.id ? `<button type="button" class="textbtn remove" data-act="removeitem" data-id="${it.id}">Remove from list</button>` : ''}`,
    foot: `<button type="button" class="btn ghost" data-act="close">Cancel</button>
           <button type="submit" class="btn primary wide">${it.id ? 'Save' : 'Add to list'}</button>`,
  });
  const f = s.querySelector('#sheetform');
  const togs = { starred: !!it.starred, flexible: !!it.flexible };
  f.querySelectorAll('[data-tog]').forEach(b => b.onclick = () => {
    togs[b.dataset.tog] = !togs[b.dataset.tog];
    b.classList.toggle('on', togs[b.dataset.tog]);
  });
  const lookup = () => linkLookup(f.url.value, f, s.querySelector('#lookup'));
  f.url.addEventListener('paste', () => setTimeout(lookup, 50));
  f.url.addEventListener('change', lookup);
  if (!it.id) setTimeout(() => f.title.focus(), 250);

  f.onsubmit = async e => {
    e.preventDefault();
    if (!f.title.value.trim()) { toast('Give it a name first.', true); f.title.focus(); return; }
    const btn = f.querySelector('[type=submit]');
    btn.disabled = true;
    const payload = {
      id: it.id || null, owner_id: opts.ownerId, secret: !!opts.secret,
      title: f.title.value, url: f.url.value, price: f.price.value, size: f.size.value,
      color: f.color.value, notes: f.notes.value, image_url: f.image_url.value,
      starred: opts.secret ? !!it.starred : togs.starred,
      flexible: opts.secret ? !!it.flexible : togs.flexible,
      qty: opts.secret ? (it.qty === undefined ? 1 : it.qty) : (f.qty.value === 'any' ? null : Number(f.qty.value)),
    };
    try {
      await attempt(() => rpc('wl_save_item', { p_item: payload }), it.id ? 'Saved ✓' : 'Added ✓');
      closeSheet();
      await refresh();
    } catch { btn.disabled = false; }
  };
}

let lookupSeq = 0;
async function linkLookup(raw, f, el) {
  let u = (raw || '').trim();
  if (!u) return;
  if (!/^https?:\/\//i.test(u) && /^[^\s/:]+\.[^\s]+/.test(u)) u = 'https://' + u;
  if (!safeUrl(u) || !PREVIEW_FUNCTION) return;
  const seq = ++lookupSeq;
  el.textContent = 'Looking that up…';
  try {
    const r = await fetch(`${SUPABASE_URL}/functions/v1/${PREVIEW_FUNCTION}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: S.key, url: u }),
    });
    if (seq !== lookupSeq) return;
    if (!r.ok) throw 0;
    const d = await r.json();
    const filled = [];
    if (d.title && !f.title.value.trim()) { f.title.value = d.title.slice(0, 200); filled.push('name'); }
    if (d.price && !f.price.value.trim()) { f.price.value = d.price; filled.push('price'); }
    if (d.image && !f.image_url.value.trim()) { f.image_url.value = d.image; filled.push('picture'); }
    el.textContent = filled.length ? `✓ Filled in the ${filled.join(', ')}` : '';
  } catch { if (seq === lookupSeq) el.textContent = ''; }
}

/* ----- detail view (Shop and My Shopping) ----- */
function detailSheet({ it, ownerName, mine, others, open, removed, changed, claimId, canAct }) {
  const img = safeUrl(it.image_url), url = safeUrl(it.url);
  const facts = [];
  if (it.price !== null && it.price !== undefined) facts.push(['Price', money(it.price)]);
  if (it.size) facts.push(['Size', esc(it.size)]);
  if (it.color) facts.push(['Color', esc(it.color)]);
  if (it.qty === null) facts.push(['How many', 'Any number']);
  else if (it.qty > 1) facts.push(['How many', it.qty + (it.remaining !== undefined && it.remaining !== null ? ` (${it.remaining} still open)` : '')]);
  let body = '';
  if (img) body += `<img class="hero" src="${esc(img)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">`;
  if (it.secret) body += `<div class="banner secret">🤫 Surprise gift${it.secret_by ? ' from ' + esc(it.secret_by) : ''}. ${esc(first(ownerName))} can't see it.</div>`;
  body += `<p class="d-title">${it.starred ? '<span style="color:var(--gold)">★</span> ' : ''}${esc(it.title)}</p>`;
  if (it.starred) body += `<div class="sub" style="margin:-4px 0 6px;color:var(--gold);font-weight:700">${esc(first(ownerName))} really wants this</div>`;
  if (it.flexible) body += `<div class="sub" style="margin:-2px 0 6px">Something similar is fine too</div>`;
  if (facts.length) body += `<dl class="facts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
  if (it.notes) body += `<div class="notes">${esc(it.notes)}</div>`;
  if (url) body += `<a class="btn outline block linkout" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Open at ${esc(host(url))} ↗</a>`;
  if (removed) body += `<div class="banner gone">${esc(first(ownerName))} took this off their list.${mine?.status === 'bought' ? " You already bought it, so it's your call." : ''}</div>`;
  else if (changed) body += `<div class="banner warn">⚠️ ${esc(first(ownerName))} changed this after it was claimed. Check the details above.</div>`;
  if (mine) body += `<p class="who ${mine.status === 'bought' ? 'bought' : 'mine'}">${mine.status === 'bought' ? '✅ Bought' : "🎁 You're getting this"}${mine.qty > 1 ? ` (×${mine.qty})` : ''}${mine.label ? ' · ' + mine.label : ''}</p>`;
  (others || []).forEach(c => body += `<p class="who taken">${c.status === 'bought' ? '✅ Bought by' : '🎁 Getting it:'} ${esc(c.name)}${c.qty > 1 ? ` (×${c.qty})` : ''}</p>`);

  let foot = '';
  if (mine && canAct !== false) {
    if (changed && !removed) foot += `<button class="btn ghost" data-act="claimact" data-claim="${claimId}" data-do="ack">OK, got it</button>`;
    foot += mine.status === 'bought'
      ? `<button class="btn ghost" data-act="claimact" data-claim="${claimId}" data-do="unbought">Not bought yet</button>`
      : removed ? '' : `<button class="btn primary" data-act="claimact" data-claim="${claimId}" data-do="bought">Mark bought</button>`;
    foot += `<button class="btn ghost" data-act="claimact" data-claim="${claimId}" data-do="release">${removed ? 'Remove' : 'Never mind'}</button>`;
  }
  if (open) foot += `<button class="btn claim wide" data-act="claim" data-id="${it.id}">${mine ? 'Get more' : "I'll get it"}</button>`;
  if (it.can_edit_secret) foot += `<button class="btn ghost" data-act="editsecret" data-id="${it.id}">Edit</button>`;
  if (!foot) foot = `<button class="btn ghost" data-act="close">Close</button>`;
  openSheet({ title: 'Details', body, foot });
}

function openShopDetail(id) {
  const it = S.shopList.items.find(x => x.id === id);
  if (!it) return;
  const p = person(S.shopPerson);
  const { mine, others, open } = shopState(it);
  detailSheet({ it, ownerName: p.name, mine, others, open, removed: it.removed, changed: mine?.changed, claimId: mine?.id });
}
function openShoppingDetail(claimId) {
  const r = S.shopping.rows.find(x => x.claim_id === claimId);
  if (!r) return;
  const mine = { status: r.status, qty: r.qty, label: S.shopScope === 'household' && !r.mine ? esc(r.claimer) : '' };
  detailSheet({ it: { ...r.item, qty: 1 }, ownerName: r.recipient.name, mine, others: [], open: false, removed: r.removed, changed: r.changed, claimId });
}

      <label class="f">Your picture</label>
      <div class="emojis">${EMOJIS.map(e => `<button type="button" data-emoji="${e}" class="${e === p.emoji ? 'on' : ''}">${e}</button>`).join('')}</div>`,
    foot: `<button type="button" class="btn ghost" data-act="close">Cancel</button><button type="submit" class="btn primary wide">Save</button>`,
  });
  let emoji = p.emoji;
  s.querySelectorAll('[data-emoji]').forEach(b => b.onclick = () => {
    emoji = b.dataset.emoji;
    s.querySelectorAll('[data-emoji]').forEach(x => x.classList.toggle('on', x === b));
  });
  const f = s.querySelector('#sheetform');
  f.onsubmit = async e => {
    e.preventDefault();
    const c = {};
    CARD_FIELDS.forEach(([k]) => { const v = f[k].value.trim(); if (v) c[k] = v; });
    try {
      await attempt(() => rpc('wl_save_profile', { p_person: p.id, p_card: c, p_emoji: emoji }), 'Saved ✓');
      closeSheet(); await refresh();
    } catch {}
  };
}
function viewCard(p) {
  const card = p.card || {};
  const filled = CARD_FIELDS.filter(([k]) => card[k]);
  openSheet({
    title: `${esc(p.name)}'s sizes`,
    body: filled.length ? `<dl class="facts">${filled.map(([k, l]) => `<dt>${l}</dt><dd>${esc(card[k])}</dd>`).join('')}</dl>`
      : `<p class="sub">${esc(p.name)} hasn't filled this in yet.</p>`,
    foot: `<button class="btn ghost" data-act="close">Close</button>`,
  });
}

/* ----- claim ----- */
function startClaim(id) {
  const it = S.shopList?.items.find(x => x.id === id);
  if (!it) return;
  const multi = it.remaining === null || it.remaining > 1;
  if (!multi) return doClaim(id, 1);
  const max = it.remaining ?? 99;
  let q = 1;
  const s = openSheet({
    title: 'How many?',
    body: `<p class="sub" style="text-align:center">${it.remaining ? `${it.remaining} still open` : 'They want as many as people like'}</p>
      <div class="stepper"><button type="button" data-step="-1">−</button><span class="num" id="cq">1</span><button type="button" data-step="1">＋</button></div>`,
    foot: `<button class="btn ghost" data-act="close">Cancel</button><button class="btn claim wide" id="cqgo">I'll get it</button>`,
  });
  s.querySelectorAll('[data-step]').forEach(b => b.onclick = () => {
    q = Math.min(max, Math.max(1, q + Number(b.dataset.step)));
    s.querySelector('#cq').textContent = q;
  });
  s.querySelector('#cqgo').onclick = () => { closeSheet(); doClaim(id, q); };
}
async function doClaim(id, qty) {
  closeSheet();
  try { await attempt(() => rpc('wl_claim', { p_item: id, p_qty: qty }), "You've got it! Added to My Shopping 🎁"); } catch {}
  await refresh();
}

/* ---------------- actions ---------------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  switch (act) {
    case 'tab':
      S.tab = b.dataset.tab; lsSet('dibs.tab', S.tab);
      if (S.tab === 'shop') { S.shopPerson = null; S.showTaken = false; }
      render(); window.scrollTo(0, 0); refresh(true); break;
    case 'listfor': S.listFor = b.dataset.id; S.list = null; render(); refresh(); break;
    case 'shopperson': S.shopPerson = b.dataset.id; S.shopList = null; S.showTaken = false; render(); window.scrollTo(0, 0); refresh(); break;
    case 'shopback': S.shopPerson = null; render(); window.scrollTo(0, 0); break;
    case 'toggletaken': S.showTaken = !S.showTaken; render(); break;
    case 'scope': S.shopScope = b.dataset.scope; S.shopping = null; render(); refresh(); break;
    case 'add': { const o = person(S.listFor) || S.me; itemForm(null, { ownerId: S.listFor, ownerName: o.name }); break; }
    case 'edit': {
      const it = S.list.items.find(x => x.id === b.dataset.id);
      const o = person(S.listFor) || S.me;
      itemForm(it, { ownerId: S.listFor, ownerName: o.name }); break;
    }
    case 'detail': openShopDetail(b.dataset.id); break;
    case 'sdetail': openShoppingDetail(b.dataset.claim); break;
    case 'addsecret': { const o = person(S.shopPerson); itemForm(null, { ownerId: o.id, ownerName: o.name, secret: true }); break; }
    case 'editsecret': {
      const it = S.shopList.items.find(x => x.id === b.dataset.id);
      const o = person(S.shopPerson);
      itemForm(it, { ownerId: o.id, ownerName: o.name, secret: true }); break;
    }
    case 'removeitem':
      if (!confirm('Remove this from the list?')) return;
      try { await attempt(() => rpc('wl_remove_item', { p_item: b.dataset.id }), 'Removed'); closeSheet(); await refresh(); } catch {}
      break;
    case 'editcard': cardForm(S.list.person); break;
    case 'viewcard': viewCard(S.shopList.person); break;
    case 'claim': startClaim(b.dataset.id); break;
    case 'togglebought':
    case 'claimact': {
      const what = b.dataset.do;
      if (what === 'release' && !confirm('Let this go so someone else can get it?')) return;
      const msg = { bought: 'Bought ✓', unbought: 'Moved back to To buy', release: 'Let go', ack: '' }[what];
      try { await attempt(() => rpc('wl_claim_action', { p_claim: b.dataset.claim, p_action: what }), msg); } catch {}
      closeSheet(); await refresh(); break;
    }
    case 'close': closeSheet(); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.row[role=button]')) { e.preventDefault(); e.target.click(); }
});

boot();
</script>
</body>
</html>
